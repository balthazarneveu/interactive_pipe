name: Ruff Format

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ruff-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          args: "format --check"
