name: Type Check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[full]"
      - uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef  # v3.0.2
        continue-on-error: true  # Informational only - won't block builds

  user-code-typing:
    # Blocking: typed user code (test/typing_usage/) must pass mypy --strict and pyright strict
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,pytest]"
      - run: python -m pytest test/test_static_typing.py -v
