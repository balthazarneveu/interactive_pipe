name: publish

on:
  push:
    tags: ["v*"]

# Every job reads only; the publish job adds the OIDC token it needs
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check tag matches pyproject version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $VERSION"; exit 1
          fi
      - name: Promote [qt6] extra to core dependencies (official PyPI release)
        # The repo keeps minimal deps (pip install from git stays light);
        # the PyPI wheel adds only PyQt6 so `pip install interactive-pipe` gives
        # the Qt backend. Other backends stay opt-in extras ([dpg], [notebook],
        # [gradio], [full]) to keep the default install small.
        run: |
          python - <<'EOF'
          import re, tomllib
          path = "pyproject.toml"
          text = open(path).read()
          data = tomllib.loads(text)
          core = data["project"]["dependencies"]
          extra = [d for d in data["project"]["optional-dependencies"]["qt6"] if d not in core]
          block = re.search(r"^dependencies = \[\n(.*?)^\]", text, re.S | re.M)
          new = block.group(0)[:-1] + "".join(f'  "{d}",\n' for d in extra) + "]"
          text = text[: block.start()] + new + text[block.end():]
          assert tomllib.loads(text)["project"]["dependencies"] == core + extra
          open(path, "w").write(text)
          print("dependencies:", core + extra)
          EOF
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Smoke-test the built wheel (the metadata that is published, not the repo's)
        env:
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          wheel-env/bin/interactive-pipe --version
          wheel-env/bin/interactive-pipe doctor
          wheel-env/bin/interactive-pipe snapshot "$GITHUB_WORKSPACE/demo/color_demo.py" -o "$RUNNER_TEMP/shots/"
          ls "$RUNNER_TEMP"/shots/*.png
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
